<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Prévia mobile — OTINIEL Portfolio V2</title>
  <style>
    :root{color-scheme:dark;--bg:#090a0f;--panel:#12151e;--line:#303446;--text:#f0eff7;--muted:#aeb2c3;--accent:#8879ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.preview-bar{position:relative;z-index:2;min-height:48px;padding:9px 13px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);background:var(--panel);font-size:10px;letter-spacing:.08em}.preview-brand{display:flex;align-items:center;gap:9px;min-width:0}.preview-mark{flex:0 0 27px;width:27px;height:27px;object-fit:contain}.preview-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview-tag{color:var(--muted);font-size:8px}.preview-open{flex:0 0 auto;padding:8px 10px;border:1px solid var(--line);border-radius:5px;color:var(--text);text-decoration:none;font-size:9px}.preview-open:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.preview-frame{width:min(100%,430px);height:calc(100svh - 48px);min-height:480px;margin:0 auto;border-inline:1px solid var(--line);background:var(--bg);box-shadow:0 0 60px #0005}iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}@media(max-width:520px){.preview-bar{min-height:44px;padding:7px 9px}.preview-frame{width:100%;height:calc(100svh - 44px);min-height:0;border:0}.preview-tag{display:none}.preview-open{padding:7px 8px;font-size:8px}}
  </style>
</head>
<body><header class="preview-bar"><div class="preview-brand"><img class="preview-mark" src="assets/brand/atom.svg" alt=""><span class="preview-title">OTINIEL / V2</span><span class="preview-tag">MOBILE / QA</span></div><a class="preview-open" href="./index.html" target="_top" rel="noopener">ABRIR DIRETO ↗</a></header><main class="preview-frame"><iframe src="./index.html" title="Prévia responsiva do portfólio" loading="eager"></iframe></main></body></html>
